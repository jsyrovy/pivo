name: Set up uv
description: Install uv with a per-job dependency cache.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        # Per job: jobs install different things, and a shared key keeps whichever saved first.
        cache-suffix: ${{ github.job }}
