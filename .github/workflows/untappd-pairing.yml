name: untappd-pairing
on:
  schedule:
    # Off the top of the hour: that is when GitHub delays and drops scheduled runs the most.
    - cron: "17 13-22 * * *"
  workflow_dispatch:
permissions:
  contents: write
# archivist, pivni-valka and untappd-pairing all commit to main; serialise them so pushes never race.
concurrency:
  group: commit-to-main
  cancel-in-progress: false
jobs:
  pairing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Run
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: make run-untappd-pairing
      - name: Save
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: Update untappd pairings
          file_pattern: untappd_pairing/pairings.json untappd_pairing/fixtures.json
