name: Tests
on: push
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install uv
        uses: ./.github/actions/setup-uv
      - name: Test with coverage
        run: make coverage
  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install uv
        uses: ./.github/actions/setup-uv
      - name: Test
        run: make mypy
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install uv
        uses: ./.github/actions/setup-uv
      - name: Test
        run: make lint
#  ty:
#    runs-on: ubuntu-latest
#    steps:
#      - name: Check out
#        uses: actions/checkout@v7
#      - name: Install uv
#        uses: ./.github/actions/setup-uv
#      - name: Test
#        run: make ty
  lint-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install uv
        uses: ./.github/actions/setup-uv
      - name: Lint HTML templates
        run: make lint-html
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install uv
        uses: ./.github/actions/setup-uv
      - name: Check formatting
        run: make format-check
  tap-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: workers/tap-api/package-lock.json
      - name: Install dependencies
        working-directory: workers/tap-api
        run: npm ci
      - name: Typecheck
        working-directory: workers/tap-api
        run: npm run typecheck
      - name: Test
        run: make test-tap-api
  smoke-pivni-valka:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install uv
        uses: ./.github/actions/setup-uv
      - name: Test pivni-valka
        run: |
          rm -rf dist/
          echo "BEGIN TRANSACTION; CREATE TABLE [pivni_valka] ([id] integer PRIMARY KEY, [date] text, [user] text, [unique_beers] integer); INSERT INTO "pivni_valka" (date, user, unique_beers) VALUES('1999-01-01','sejrik',0); INSERT INTO "pivni_valka" (date, user, unique_beers) VALUES('1999-01-01','mencik2',0); INSERT INTO "pivni_valka" (date, user, unique_beers) VALUES('1999-01-01','Indi51',0); INSERT INTO "pivni_valka" (date, user, unique_beers) VALUES('1999-01-01','ominar',0); INSERT INTO "pivni_valka" (date, user, unique_beers) VALUES('1999-01-01','karolina_matukova_7117',0); COMMIT;" > data/data_dump.sql
          make run-pivni-valka-notificationless
          test -e dist/pivni-valka/index.html
          grep "Pivní válka" dist/pivni-valka/index.html
          grep "INSERT INTO \"pivni_valka\" VALUES(2" data/data_dump.sql
