name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # Called by pivni-valka and untappd-pairing, only when their run committed new data.
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy. Without it a caller deploys the commit it started from, not the data it just pushed.
        type: string
        default: ""
  push:
    paths:
      - "templates/**"
      - "web/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # Per job: jobs install different things, and a shared key keeps whichever saved first.
          cache-suffix: ${{ github.job }}
      - run: make publish-all
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: echo "Deploy attempt 1 failed, retrying..." && sleep 10
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        id: deploy-retry-1
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.deploy-retry-1.outcome == 'failure'
        run: echo "Deploy attempt 2 failed, retrying..." && sleep 30
      - if: steps.deployment.outcome == 'failure' && steps.deploy-retry-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        id: deploy-retry-2
