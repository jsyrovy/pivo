name: pivni-valka
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
# archivist, pivni-valka and untappd-pairing all commit to main; serialise them so pushes never race.
concurrency:
  group: commit-to-main
  cancel-in-progress: false
jobs:
  pivni-valka:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Prague
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Run
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: make run-pivni-valka
      - name: Save
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: data/data_dump.sql
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: Update pivni-valka
