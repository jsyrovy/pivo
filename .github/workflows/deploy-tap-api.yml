name: Deploy Tap API Worker

on:
  push:
    # Without the branch filter every branch deployed straight to production.
    branches:
      - main
    paths:
      - "workers/tap-api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: workers/tap-api/package-lock.json

      - name: Install dependencies
        working-directory: workers/tap-api
        run: npm ci

      # Cross-workflow `needs:` does not exist, so the gate has to live in this job:
      # a red suite must stop the deploy, not just fail a parallel run.
      - name: Typecheck
        working-directory: workers/tap-api
        run: npm run typecheck

      - name: Test
        working-directory: workers/tap-api
        run: npm test

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No wranglerVersion: the action then uses the wrangler from package-lock.json that `npm ci`
          # installed above, so the tested and the deploying versions cannot drift apart.
          workingDirectory: workers/tap-api
