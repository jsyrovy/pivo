name: archivist
on:
  schedule:
    # Off the top of the hour: that is when GitHub delays and drops scheduled runs the most.
    - cron: "41 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
# archivist, pivni-valka and untappd-pairing all commit to main; serialise them so pushes never race.
concurrency:
  group: commit-to-main
  cancel-in-progress: false
jobs:
  archivist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Install uv
        uses: ./.github/actions/setup-uv
      - name: Run
        env:
          FEED_KEY: ${{ secrets.FEED_KEY }}
        run: make run-archivist
      - name: Save
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: Update archivist
