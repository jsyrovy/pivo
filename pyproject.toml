[project]
name = "untappd"
version = "0.1.0"
description = "Beers, beers everywhere 🍺"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "httpx[http2]>=0.28.1",
    "jinja2>=3.1.4",
    "openrouter>=0.9.1",
    "sqlalchemy>=2.0.36",
]

[tool.djlint]
profile = "jinja"
indent = 4
max_line_length = 120
ignore = "H030,H031,J018"

[tool.coverage.report]
# The entry-point guard only runs when the module is executed as a script, never under pytest.
exclude_also = ['if __name__ == "__main__":']
# The suite is at 100%; keep it there. Cover the new branch or exclude it deliberately.
fail_under = 100
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "coverage>=7.6.9",
    "ipython>=8.30.0",
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "types-mock>=5.1.0.20240425",
]
